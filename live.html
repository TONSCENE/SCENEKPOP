<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SCENEKPOP+ MAMA AWARD 2026 — LIVE</title>
  <meta name="description" content="SCENEKPOP+ MAMA AWARD 2026 ถ่ายทอดสดผ่าน DPlayer + HLS รองรับ PC, Mac, Android และ iPhone" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Fonts & Icons (ตรงกับ SCENEKPOP+) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- DPlayer + HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>

  <style>
    :root {
      --bg-color: #050508;
      --surface-color: #0e0f15;
      --card-bg: #13141c;
      --card-hover: #1d1f2b;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-cyan: #38bdf8;
      --live-red: #ef4444;
      --text-white: #ffffff;
      --text-gray: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --neon-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 52%, #38bdf8 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body {
      background-color: var(--bg-color);
      background-image:
        radial-gradient(circle at 12% 0%, rgba(168, 85, 247, 0.14), transparent 38%),
        radial-gradient(circle at 88% 0%, rgba(236, 72, 153, 0.12), transparent 36%);
      color: var(--text-white);
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Navbar (สไตล์เดียวกับ SCENEKPOP+) */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 120;
      background: rgba(5, 5, 8, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(168, 85, 247, 0.22);
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.75);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .brand-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--neon-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-pink);
    }

    .nav-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.55);
      color: #fecaca !important;
      font-weight: 700 !important;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live-red);
      box-shadow: 0 0 8px var(--live-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .nav-pill-btn:hover { transform: translateY(-1px); }
    .patreon-btn { background: #ff424d; }
    .yt-btn { background: #dc2626; }

    /* Main Content */
    .main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 92px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .live-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .live-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .live-header p {
      font-size: 0.9rem;
      color: var(--text-gray);
      margin-top: 2px;
    }

    .tag-live {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
      background: var(--neon-gradient);
      color: #fff;
      letter-spacing: 0.04em;
    }

    .player-shell {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
    }

    .unmute-overlay {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(5, 5, 8, 0.82);
      backdrop-filter: blur(8px);
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .unmute-overlay:hover {
      background: rgba(236, 72, 153, 0.88);
    }

    #dplayer {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      padding: 9px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.15s, transform 0.12s;
    }

    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: scale(0.97); }
    .btn-neon {
      background: var(--neon-gradient);
      border-color: transparent;
    }

    /* Channels Section */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .section-head h2 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.16s, background 0.16s, border-color 0.16s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(236, 72, 153, 0.45);
    }

    .channel-card.active {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 1px rgba(236, 72, 153, 0.4);
    }

    .channel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .channel-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
    }

    .channel-badge.off {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-gray);
    }

    .channel-title {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .channel-desc {
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #13141c;
      color: #fff;
      border: 1px solid rgba(236, 72, 153, 0.45);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.22s ease;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 820px) {
      .navbar { padding: 0 16px; }
      .nav-links { gap: 12px; }
      .nav-links li:not(.keep-mobile) { display: none; }
      .nav-right .patreon-btn span, .nav-right .yt-btn span { display: none; }
      .main { padding: 84px 14px 36px; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="./" class="brand-logo">
        <i class="fa-solid fa-play" style="font-size: 18px;"></i> SCENEKPOP+
      </a>
      <ul class="nav-links">
        <li><a href="./">หน้าแรก</a></li>
        <li><a href="./#sec-groups">แยกตามวง</a></li>
        <li><a href="./#sec-playlists">เพลย์ลิสต์</a></li>
        <li><a href="./#sec-latest">คลิปล่าสุด</a></li>
        <li class="keep-mobile">
          <a href="live.html" class="nav-live-badge"><span class="pulse-dot"></span> LIVE</a>
        </li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="https://www.patreon.com/c/SCENEKPOP" target="_blank" rel="noopener noreferrer" class="nav-pill-btn patreon-btn">
        <i class="fa-brands fa-patreon"></i> <span>Patreon</span>
      </a>
      <a href="https://www.youtube.com/@SCENEKPOP" target="_blank" rel="noopener noreferrer" class="nav-pill-btn yt-btn">
        <i class="fa-brands fa-youtube"></i> <span>@SCENEKPOP</span>
      </a>
    </div>
  </nav>

  <main class="main">
    <div class="live-header">
      <div>
        <h1>
          <span id="streamTitle">SCENEKPOP+ MAMA AWARD 2026</span>
          <span class="tag-live">LIVE</span>
        </h1>
        <p id="streamSub">รับชมถ่ายทอดสดผ่านหน้าเว็บได้เลย รองรับทั้ง PC, Mac, Android และ iPhone</p>
      </div>
      <div class="row">
        <button class="btn" onclick="reloadStream()">
          <i class="fa-solid fa-rotate-right"></i> รีเฟรชสตรีม
        </button>
        <button class="btn btn-neon" onclick="sharePage()">
          <i class="fa-solid fa-share-nodes"></i> แชร์ลิงก์รับชม
        </button>
      </div>
    </div>

    <!-- DPlayer Theater -->
    <section class="player-shell">
      <button id="unmuteOverlay" class="unmute-overlay" onclick="unmutePlayer()">
        <i class="fa-solid fa-volume-xmark" style="color: var(--accent-pink);"></i> แตะเพื่อเปิดเสียง
      </button>
      <div id="dplayer"></div>
    </section>

    <!-- Live Channels Directory -->
    <div class="section-head">
      <h2><i class="fa-solid fa-tower-broadcast" style="color: var(--live-red);"></i> ช่องรายการ LIVE</h2>
    </div>
    <section class="channels-grid" id="channelsGrid"></section>
  </main>

  <div id="toast" class="toast">คัดลอกลิงก์แล้ว</div>

  <script>
    const FALLBACK_CHANNELS = [
      {
        id: 'mama-2026',
        title: 'SCENEKPOP+ MAMA AWARD 2026',
        group: 'SCENEKPOP+ LIVE',
        desc: 'ถ่ายทอดสดผ่านหน้าเว็บ SCENEKPOP+',
        url: '',
        live: true
      }
    ];

    let liveChannels = [...FALLBACK_CHANNELS];
    let dp = null;
    let activeHls = null;
    let currentChannel = liveChannels[0];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function getQueryParams() {
      const sp = new URLSearchParams(window.location.search);
      return {
        url: sp.get('url') || '',
        title: sp.get('title') || '',
        live: sp.get('live') !== '0',
      };
    }

    async function ensureAutoPlay(video) {
      const unmuteBtn = document.getElementById('unmuteOverlay');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      try {
        video.muted = false;
        await video.play();
        unmuteBtn.style.display = 'none';
      } catch {
        try {
          video.muted = true;
          await video.play();
          unmuteBtn.style.display = 'inline-flex';
        } catch {}
      }
    }

    function unmutePlayer() {
      if (!dp || !dp.video) return;
      dp.video.muted = false;
      dp.video.volume = 1;
      dp.video.play().catch(() => {});
      document.getElementById('unmuteOverlay').style.display = 'none';
    }

    function initPlayer(m3u8Url, isLive = true, title = '') {
      document.getElementById('unmuteOverlay').style.display = 'none';
      if (title) {
        document.getElementById('streamTitle').textContent = title;
        document.title = `${title} — LIVE`;
      }

      if (activeHls) {
        activeHls.destroy();
        activeHls = null;
      }
      if (dp) {
        dp.destroy();
        dp = null;
      }

      if (!m3u8Url) {
        document.getElementById('dplayer').innerHTML =
          '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9ca3af;padding:24px;text-align:center;gap:8px;">' +
          '<i class="fa-solid fa-tower-broadcast" style="font-size:32px;color:#ec4899;"></i>' +
          '<div>ยังไม่มีสัญญาณถ่ายทอดสดในขณะนี้</div>' +
          '</div>';
        return;
      }

      dp = new DPlayer({
        container: document.getElementById('dplayer'),
        live: isLive,
        autoplay: true,
        theme: '#ec4899',
        video: {
          url: m3u8Url,
          type: 'customHls',
          customType: {
            customHls: function (video) {
              video.addEventListener('volumechange', () => {
                if (!video.muted && video.volume > 0) {
                  document.getElementById('unmuteOverlay').style.display = 'none';
                }
              });
              if (window.Hls && Hls.isSupported()) {
                activeHls = new Hls({
                  enableWorker: true,
                  lowLatencyMode: isLive,
                  backBufferLength: 90,
                });
                activeHls.loadSource(m3u8Url);
                activeHls.attachMedia(video);
                activeHls.on(Hls.Events.MANIFEST_PARSED, () => {
                  ensureAutoPlay(video);
                });
              } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8Url;
                video.addEventListener('loadedmetadata', () => {
                  ensureAutoPlay(video);
                }, { once: true });
              }
            },
          },
        },
      });
    }

    function reloadStream() {
      initPlayer(currentChannel.url, currentChannel.live, currentChannel.title);
      showToast('รีเฟรชสตรีมแล้ว');
    }

    async function sharePage() {
      const shareUrl = `${window.location.origin}${window.location.pathname}`;
      const shareTitle = document.getElementById('streamTitle').textContent;

      if (navigator.share) {
        try {
          await navigator.share({
            title: shareTitle,
            text: `ดูสด ${shareTitle} ที่ SCENEKPOP+`,
            url: shareUrl,
          });
          return;
        } catch {}
      }

      try {
        await navigator.clipboard.writeText(shareUrl);
        showToast('คัดลอกลิงก์หน้าเว็บสำหรับแชร์แล้ว');
      } catch {
        prompt('คัดลอกลิงก์นี้ได้เลย:', shareUrl);
      }
    }

    function renderChannels() {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';
      liveChannels.forEach((ch) => {
        const card = document.createElement('div');
        const isActive = currentChannel && currentChannel.id === ch.id;
        card.className = 'channel-card' + (isActive ? ' active' : '');
        const hasUrl = Boolean(ch.url);
        card.innerHTML = `
          <div class="channel-top">
            <span style="color:var(--accent-cyan);">${ch.group || 'SCENEKPOP+ LIVE'}</span>
            <span class="channel-badge ${hasUrl ? '' : 'off'}">${hasUrl ? '● LIVE' : 'STANDBY'}</span>
          </div>
          <div class="channel-title">${ch.title}</div>
          <div class="channel-desc">${ch.desc || ''}</div>
        `;
        card.onclick = () => {
          currentChannel = ch;
          initPlayer(ch.url, ch.live !== false, ch.title);
          renderChannels();
        };
        grid.appendChild(card);
      });
    }

    async function loadChannelsAndStart() {
      try {
        const res = await fetch(`./live_channels.json?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.channels) && data.channels.length > 0) {
            liveChannels = data.channels;
          }
        }
      } catch {}

      const q = getQueryParams();
      if (q.url) {
        currentChannel = {
          id: 'custom',
          title: q.title || 'SCENEKPOP+ MAMA AWARD 2026',
          group: 'SCENEKPOP+ LIVE',
          desc: 'ถ่ายทอดสดผ่านหน้าเว็บ SCENEKPOP+',
          url: q.url,
          live: q.live,
        };
      } else {
        currentChannel = liveChannels.find((c) => c.url) || liveChannels[0];
      }

      initPlayer(currentChannel.url, currentChannel.live !== false, currentChannel.title);
      renderChannels();
    }

    loadChannelsAndStart();
  </script>
</body>
</html>
